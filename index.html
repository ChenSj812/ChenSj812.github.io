<!DOCTYPE html>
<html>
<head>
    <title>我的项目展示</title>
</head>
<body>
    <h1>我的GitHub项目</h1>
    
    <!-- 嵌入式展示方式1：使用iframe -->
    <h2>项目1：某仓库</h2>
    <iframe src="https://github.com/ChenSj812/SUSTech_AIB_Project_2025_Fall/" 
            width="100%" 
            height="600px">
    </iframe>
    
    <!-- 嵌入式展示方式2：只展示README -->
    <h2>项目2：另一个仓库</h2>
    <div id="readme-content"></div>
    
    <script>
        // 通过GitHub API获取README
        fetch('https://api.github.com/repos/ChenSj812/SUSTech_AIB_Project_2025_Fall/readme')
            .then(res => res.json())
            .then(data => {
                const content = atob(data.content);
                document.getElementById('readme-content').innerHTML = 
                    '<pre>' + content + '</pre>';
            });
    </script>
</body>
</html>
